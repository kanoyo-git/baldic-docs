{% extends template.self %}

{% block head %}
    <meta name="HandheldFriendly" content="true">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#28702d">
    <link rel="icon" type="image/png" href="{{ config.variables.siteRoot }}/assets/baldic-logo.png">
    <link rel="apple-touch-icon" href="{{ config.variables.siteRoot }}/assets/baldic-logo.png">
{% endblock %}

{% block search_input %}
<div id="book-search-input" role="search">
    <input type="search" aria-label="Поиск по документации" placeholder="Подготовка поиска…" disabled>
</div>
{% endblock %}

{% block javascript %}
    {{ super() }}
    <script src="{{ 'assets/site.js'|resolveFile }}"></script>
{% endblock %}
